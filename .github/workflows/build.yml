name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          # Use the runner's SDK if present, otherwise install the command-line tools.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools" && cd "$SDK/cmdline-tools"
            curl -sSfLo ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q ct.zip && rm -rf latest && mv cmdline-tools latest && rm ct.zip
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "$GITHUB_WORKSPACE/local.properties"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DUNE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DUNE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/dune-release.jks
            printf 'storeFile=app/dune-release.jks\nstorePassword=%s\nkeyAlias=dune\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          else
            echo "::warning::No signing secrets set - APK will be unsigned"
          fi
      - run: chmod +x gradlew && ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release*.apk Dune.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Dune-apk
          path: Dune.apk
      - name: Publish release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Dune.apk --title "Dune $GITHUB_REF_NAME" --generate-notes
